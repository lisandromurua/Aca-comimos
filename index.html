<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comimos Acá</title>
<meta name="description" content="Catálogo personal de restaurantes visitados: filtros, mapa y fichas de puntuación.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🍽️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 12v9"/><path d="M17 3c-1.7 0-3 2-3 5s1.3 5 3 5"/><path d="M17 3v16"/></svg>
    </div>
    <div>
      <div class="brand-title">Comimos Acá</div>
      <div class="brand-sub" id="brand-count">77 lugares registrados</div>
    </div>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" data-view="grid" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Grilla
    </button>
    <button class="view-btn" data-view="map" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/></svg>
      Mapa
    </button>
  </div>
</header>

<div class="filter-bar">
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="f-search" placeholder="Buscar un lugar...">
  </div>

  <button class="btn-ghost filter-toggle" id="filter-toggle" type="button" aria-expanded="false">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
    Filtros
  </button>

  <div class="filter-extra" id="filter-extra">
    <select id="f-provincia" class="select-chip"><option value="">Provincia</option></select>
    <select id="f-localidad" class="select-chip"><option value="">Localidad</option></select>
    <select id="f-barrio" class="select-chip"><option value="">Barrio</option></select>
    <select id="f-momento" class="select-chip"><option value="">Momento del día</option></select>
    <select id="f-precio" class="select-chip"><option value="">Precio</option></select>

    <div class="score-filter">
      <label for="f-score">Puntuación mín.</label>
      <input type="range" id="f-score" min="0" max="10" step="0.5" value="0">
      <span id="f-score-val">0</span>
    </div>

    <label class="check-chip">
      <input type="checkbox" id="f-distincion">
      Solo con distinción
    </label>

    <button class="btn-ghost" id="f-clear" type="button">Limpiar filtros</button>
  </div>

  <div class="result-count" id="result-count"></div>
</div>

<main>
  <section id="view-grid" class="view active">
    <div class="grid" id="grid-container"></div>
    <div class="empty-state" id="grid-empty" hidden>No hay lugares que coincidan con estos filtros.</div>
  </section>

  <section id="view-map" class="view">
    <div id="map"></div>
  </section>
</main>

<div class="detail-overlay" id="detail-overlay">
  <div class="detail-panel" id="detail-panel"></div>
</div>

<footer class="site-footer">
  Hecho a mano por Lisandro · datos propios, sin API externa · mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
